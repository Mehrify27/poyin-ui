name: Release Binary

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create or update GitHub Release for this tag"
        type: boolean
        default: false
      tag:
        description: "Release tag (defaults to v<config/version> when publishing)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build-amd64:
    name: Build & Verify (linux/amd64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go vet
        env:
          CGO_ENABLED: "1"
        run: go vet ./...

      - name: Build complete vpn-ui-amd64 binary
        run: ./build.sh --arch amd64

      - name: Run unit tests with race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...

      - name: Generate SHA-256 checksum
        working-directory: build/out
        run: sha256sum vpn-ui-amd64 > vpn-ui-amd64.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpn-ui-amd64
          path: |
            build/out/vpn-ui-amd64
            build/out/vpn-ui-amd64.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="v$(tr -d '[:space:]' < config/version)"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              build/out/vpn-ui-amd64 \
              build/out/vpn-ui-amd64.sha256 \
              --clobber
          else
            gh release create "$TAG" \
              build/out/vpn-ui-amd64 \
              build/out/vpn-ui-amd64.sha256 \
              --title "poyin-ui $TAG" \
              --generate-notes
          fi
