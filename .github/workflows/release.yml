name: Release Binary

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create or update GitHub Release for this tag"
        type: boolean
        default: false
      tag:
        description: "Release tag (defaults to v<config/version> when publishing)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build-amd64:
    name: Build & Verify (linux/amd64)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/frontend/package-lock.json

      - name: Build & verify frontend SPA bundle
        run: |
          cd web/frontend
          npm ci --no-audit --no-fund
          npm run build

      - name: Go vet
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-g -O2 -Wno-discarded-qualifiers"
        run: go vet ./...

      - name: Build complete vpn-ui-amd64 binary
        run: ./build.sh --arch amd64 --skip-frontend

      - name: Smoke-test static binary across Linux distros
        run: |
          set -euo pipefail
          BIN="$PWD/build/out/vpn-ui-amd64"
          test -s "$BIN"
          file_desc="$(file -b "$BIN")"
          echo "Binary: $file_desc"
          echo "$file_desc" | grep -qiE 'statically linked|static-pie linked'
          if ldd "$BIN" 2>&1 | grep -qiE 'libc\.so|libpthread|ld-linux'; then
            echo "Unexpected dynamic libc dependency:" >&2
            ldd "$BIN" >&2 || true
            exit 1
          fi

          for img in ubuntu:24.04 debian:12 alpine:3.20; do
            echo "::group::Smoke test in $img"
            docker pull -q "$img" >/dev/null
            docker run --rm \
              -v "$BIN:/usr/local/bin/vpn-ui:ro" \
              -e VPNUI_DB_FOLDER=/tmp/vpndb \
              -e VPNUI_LOG_FOLDER=/tmp/vpndb \
              -e VPNUI_BIN_FOLDER=/tmp/vpndb/bin \
              "$img" sh -eu -c '
                mkdir -p /tmp/vpndb /tmp/vpndb/bin
                ver="$(/usr/local/bin/vpn-ui -v)"
                echo "$0 version: $ver"
                test -n "$ver"
                /usr/local/bin/vpn-ui install-menu /tmp/vpn-ui-menu
                test -x /tmp/vpn-ui-menu
                if command -v bash >/dev/null 2>&1; then
                  bash -n /tmp/vpn-ui-menu
                  /tmp/vpn-ui-menu --help | grep -q "bbr"
                  /tmp/vpn-ui-menu bbr status
                fi
                /usr/local/bin/vpn-ui update-core --list
                /usr/local/bin/vpn-ui migrate
                test -s /tmp/vpndb/vpn-ui.db
                /usr/local/bin/vpn-ui migrate
              ' "$img"
            echo "::endgroup::"
          done

      - name: Run unit tests with race detector
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-g -O2 -Wno-discarded-qualifiers"
        run: go test -race -count=1 ./...

      - name: Generate SHA-256 checksum
        working-directory: build/out
        run: sha256sum vpn-ui-amd64 > vpn-ui-amd64.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: vpn-ui-amd64
          path: |
            build/out/vpn-ui-amd64
            build/out/vpn-ui-amd64.sha256
            build/out/vpn-ui-*.tar.gz
            build/out/vpn-ui-*.tar.gz.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="v$(tr -d '[:space:]' < config/version)"
          fi

          shopt -s nullglob
          ASSETS=(
            build/out/vpn-ui-amd64
            build/out/vpn-ui-amd64.sha256
            build/out/vpn-ui-*.tar.gz
            build/out/vpn-ui-*.tar.gz.sha256
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "poyin-ui $TAG" \
              --generate-notes
          fi
